<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Remote Shutter · Gallery</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="gallery">
    <header>
      <a href="/remote">‹ Remote</a>
      <span id="count"></span>
      <span class="actions" id="actions" hidden>
        <a class="button" href="/photos.zip">Download all</a>
        <button class="button danger" id="deleteAll">Delete all</button>
      </span>
    </header>
    <p class="empty" id="empty" hidden>No photos yet.</p>
    <div class="grid" id="grid"></div>
  </div>

  <script type="module">
    const grid = document.getElementById("grid");
    const count = document.getElementById("count");
    const actions = document.getElementById("actions");
    const empty = document.getElementById("empty");
    const fmt = new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" });

    async function load() {
      const photos = await (await fetch("/api/photos")).json();
      count.textContent = `${photos.length} photo${photos.length === 1 ? "" : "s"}`;
      actions.hidden = photos.length === 0;
      empty.hidden = photos.length > 0;
      grid.replaceChildren(
        ...photos.map((p) => {
          const tile = document.createElement("figure");
          tile.innerHTML = `
            <a href="${p.url}" target="_blank"><img src="${p.url}" loading="lazy" alt="" /></a>
            <figcaption>
              <span>${fmt.format(p.time)}</span>
              <span>
                <a href="${p.url}?download" download="${p.name}" aria-label="Download">↓</a>
                <button class="delete" aria-label="Delete">✕</button>
              </span>
            </figcaption>`;
          tile.querySelector(".delete").addEventListener("click", async () => {
            if (!confirm("Delete this photo?")) return;
            await fetch(`/api/photos/${p.name}`, { method: "DELETE" });
            load();
          });
          return tile;
        })
      );
    }

    document.getElementById("deleteAll").addEventListener("click", async () => {
      if (!confirm(`Delete all ${count.textContent}? This can't be undone.`)) return;
      await fetch("/api/photos", { method: "DELETE" });
      load();
    });

    load();
    // Pick up photos taken since the page was opened when you come back to it.
    document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
  </script>
</body>
</html>
