<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Remote Shutter · Camera</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="status" id="status"><span class="dot"></span>Connecting…</div>
  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <div class="overlay" id="overlay"></div>
    <div class="flash" id="flash"></div>
  </div>

  <script type="module">
    import { connect } from "/shared.js";

    const video = document.getElementById("video");
    const overlay = document.getElementById("overlay");
    const flash = document.getElementById("flash");
    const statusEl = document.getElementById("status");
    let connected = false;
    let remotes = 0;
    let busy = false;

    function renderStatus() {
      statusEl.innerHTML = connected
        ? `<span class="dot on"></span>Camera ready · ${remotes} remote${remotes === 1 ? "" : "s"} connected`
        : `<span class="dot"></span>Disconnected, retrying…`;
    }

    const streamReady = navigator.mediaDevices
      .getUserMedia({ video: { width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false })
      .then((stream) => (video.srcObject = stream))
      .catch((err) => {
        statusEl.textContent = `Camera unavailable: ${err.message}. Open this page via http://localhost.`;
        throw err;
      });

    // --- WebRTC live preview: one peer connection per remote, keyed by its id ---
    const pcs = new Map();

    function closePeer(id) {
      pcs.get(id)?.close();
      pcs.delete(id);
    }

    async function onSignal(from, data) {
      if (data.type === "offer") {
        closePeer(from);
        const pc = new RTCPeerConnection({ iceServers: [] });
        pcs.set(from, pc);
        pc.onicecandidate = (e) => {
          if (e.candidate) conn.send({ type: "signal", to: from, data: { type: "ice", candidate: e.candidate } });
        };
        pc.onconnectionstatechange = () => {
          if (["failed", "closed"].includes(pc.connectionState)) closePeer(from);
        };
        const stream = await streamReady;
        for (const track of stream.getVideoTracks()) pc.addTrack(track, stream);
        await pc.setRemoteDescription(data.sdp);
        await pc.setLocalDescription(await pc.createAnswer());
        conn.send({ type: "signal", to: from, data: { type: "answer", sdp: pc.localDescription } });
      } else if (data.type === "ice") {
        await pcs.get(from)?.addIceCandidate(data.candidate).catch(() => {});
      }
    }

    // --- JPEG fallback preview: small frames over the WebSocket while anyone wants them ---
    const frameCanvas = document.createElement("canvas");
    let frameTimer = null;

    function setJpegViewers(count) {
      if (count > 0 && !frameTimer) {
        frameTimer = setInterval(() => {
          if (!video.videoWidth || conn.buffered > 256 * 1024) return; // skip if the network is behind
          frameCanvas.width = 640;
          frameCanvas.height = Math.round((640 * video.videoHeight) / video.videoWidth);
          frameCanvas.getContext("2d").drawImage(video, 0, 0, frameCanvas.width, frameCanvas.height);
          conn.send({ type: "frame", data: frameCanvas.toDataURL("image/jpeg", 0.6) });
        }, 100);
      } else if (count === 0 && frameTimer) {
        clearInterval(frameTimer);
        frameTimer = null;
      }
    }

    const conn = connect(
      "camera",
      (msg) => {
        if (msg.type === "presence") { remotes = msg.remotes; renderStatus(); }
        if (msg.type === "shoot") shoot(msg.delay);
        if (msg.type === "signal") onSignal(msg.from, msg.data).catch((e) => console.warn("WebRTC:", e));
        if (msg.type === "peerLeft") closePeer(msg.id);
        if (msg.type === "jpegViewers") setJpegViewers(msg.count);
      },
      (ok) => {
        connected = ok;
        renderStatus();
        if (!ok) { for (const id of [...pcs.keys()]) closePeer(id); setJpegViewers(0); }
      }
    );

    await streamReady.catch(() => {});

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    async function shoot(delay) {
      if (busy || !video.videoWidth) return;
      busy = true;
      for (let s = delay; s > 0; s--) {
        overlay.textContent = s;
        conn.send({ type: "countdown", remaining: s });
        await sleep(1000);
      }
      overlay.textContent = "";

      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);
      conn.send({ type: "photo", data: canvas.toDataURL("image/jpeg", 0.92) });

      flash.classList.add("go");
      requestAnimationFrame(() => requestAnimationFrame(() => flash.classList.remove("go")));
      busy = false;
    }
  </script>
</body>
</html>
