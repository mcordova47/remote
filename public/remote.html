<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Remote Shutter · Remote</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="remote">
    <div class="status" id="status"><span class="dot"></span>Connecting…</div>
    <div class="preview">
      <video id="live" autoplay playsinline muted hidden></video>
      <img id="frames" alt="" hidden />
      <span class="mode" id="mode"></span>
    </div>
    <button class="shutter" id="shutter" disabled>Snap</button>
    <div class="delays" id="delays">
      <button data-d="0" class="sel">Now</button>
      <button data-d="3">3s</button>
      <button data-d="5">5s</button>
      <button data-d="10">10s</button>
    </div>
    <div class="saved" id="savedStatus"></div>
    <a id="lastLink" target="_blank" hidden><img class="last" id="last" alt="Last photo" /></a>
  </div>

  <script type="module">
    import { connect } from "/shared.js";

    const shutter = document.getElementById("shutter");
    const statusEl = document.getElementById("status");
    const last = document.getElementById("last");
    const lastLink = document.getElementById("lastLink");
    const savedStatus = document.getElementById("savedStatus");
    let connected = false;
    let cameras = 0;
    let delay = 0;

    // --- Preview: try WebRTC first, fall back to JPEG frames over the WebSocket ---
    const live = document.getElementById("live");
    const frames = document.getElementById("frames");
    const modeEl = document.getElementById("mode");
    let pc = null;
    let previewMode = null; // null | "connecting" | "webrtc" | "jpeg"
    let fallbackTimer = null;

    function setMode(mode) {
      previewMode = mode;
      live.hidden = mode !== "webrtc";
      frames.hidden = mode !== "jpeg";
      modeEl.textContent = { connecting: "Connecting preview…", webrtc: "Live", jpeg: "Preview (JPEG)" }[mode] || "";
    }

    function stopPreview() {
      clearTimeout(fallbackTimer);
      pc?.close();
      pc = null;
      if (previewMode === "jpeg") conn.send({ type: "preview", mode: "off" });
      live.srcObject = null;
      frames.removeAttribute("src");
      setMode(null);
    }

    function useJpeg() {
      clearTimeout(fallbackTimer);
      pc?.close();
      pc = null;
      conn.send({ type: "preview", mode: "jpeg" });
      setMode("jpeg");
    }

    async function startPreview() {
      if (previewMode) return;
      if (!window.RTCPeerConnection) return useJpeg();
      setMode("connecting");
      try {
        const myPc = (pc = new RTCPeerConnection({ iceServers: [] }));
        myPc.addTransceiver("video", { direction: "recvonly" });
        myPc.ontrack = (e) => { live.srcObject = e.streams[0] || new MediaStream([e.track]); };
        myPc.onicecandidate = (e) => {
          if (e.candidate) conn.send({ type: "signal", data: { type: "ice", candidate: e.candidate } });
        };
        myPc.onconnectionstatechange = () => {
          if (pc !== myPc) return;
          if (myPc.connectionState === "connected") { clearTimeout(fallbackTimer); setMode("webrtc"); }
          if (myPc.connectionState === "failed") useJpeg();
        };
        await myPc.setLocalDescription(await myPc.createOffer());
        conn.send({ type: "signal", data: { type: "offer", sdp: myPc.localDescription } });
        fallbackTimer = setTimeout(() => { if (previewMode === "connecting") useJpeg(); }, 6000);
      } catch (err) {
        console.warn("WebRTC unavailable, using JPEG preview:", err);
        useJpeg();
      }
    }

    async function onSignal(data) {
      if (!pc) return;
      if (data.type === "answer") await pc.setRemoteDescription(data.sdp);
      if (data.type === "ice") await pc.addIceCandidate(data.candidate).catch(() => {});
    }

    function render() {
      const ready = connected && cameras > 0;
      shutter.disabled = !ready;
      statusEl.innerHTML = !connected
        ? `<span class="dot"></span>Disconnected, retrying…`
        : cameras
          ? `<span class="dot on"></span>Camera connected`
          : `<span class="dot"></span>Waiting for camera…`;
    }

    const conn = connect(
      "remote",
      (msg) => {
        if (msg.type === "presence") {
          cameras = msg.cameras;
          render();
          if (cameras > 0) startPreview();
          else stopPreview();
        }
        if (msg.type === "signal") onSignal(msg.data).catch((e) => console.warn("WebRTC:", e));
        if (msg.type === "frame" && previewMode === "jpeg") frames.src = msg.data;
        if (msg.type === "countdown") shutter.textContent = msg.remaining;
        if (msg.type === "photo") {
          shutter.textContent = "Snap";
          last.src = msg.url;
          lastLink.href = msg.url;
          lastLink.hidden = false;
          savedStatus.className = "saved";
          savedStatus.textContent = msg.toPhotos ? "Adding to Photos…" : "Saved on the Mac";
        }
        if (msg.type === "saved") {
          shutter.textContent = "Snap";
          if (lastLink.href.endsWith(msg.url) || !msg.ok) {
            savedStatus.className = `saved ${msg.ok ? "ok" : "err"}`;
            savedStatus.textContent = msg.ok ? "✓ Saved to Photos" : msg.error;
          }
        }
      },
      (ok) => {
        connected = ok;
        render();
        if (!ok) stopPreview();
      }
    );

    shutter.addEventListener("click", () => {
      conn.send({ type: "shoot", delay });
      navigator.vibrate?.(30);
    });

    document.getElementById("delays").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      delay = Number(b.dataset.d);
      for (const x of e.currentTarget.children) x.classList.toggle("sel", x === b);
    });
  </script>
</body>
</html>
